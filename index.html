<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ViralFlow Documentation Redirect</title>
  <meta name="description"
    content="ViralFlow official documentation has moved to ReadTheDocs. You are being redirected.">

  <!-- Favicons -->
  <link href="assets/img/favicon.png" rel="icon">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0d1117;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #2f81f7;
      --accent-hover: #58a6ff;
      --card-bg: rgba(22, 27, 34, 0.8);
      --card-border: rgba(48, 54, 61, 0.8);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
      background-image: radial-gradient(circle at 50% -20%, #1f6feb33 0%, #0d1117 50%);
      background-repeat: no-repeat;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 4rem 3rem;
      max-width: 650px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(30px);
    }

    .logo-container {
      margin-bottom: 2.5rem;
      position: relative;
      display: inline-block;
    }

    .logo-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 150px;
      height: 150px;
      background: var(--accent);
      filter: blur(60px);
      opacity: 0.3;
      border-radius: 50%;
      z-index: -1;
      animation: pulseGlow 4s infinite alternate;
    }

    .logo {
      width: 200px;
      height: 200px;
      object-fit: contain;
      animation: float 6s ease-in-out infinite;
    }

    h1 {
      font-size: 2.25rem;
      margin-bottom: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      background: linear-gradient(180deg, #ffffff 0%, #c9d1d9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: var(--text-muted);
      font-size: 1.125rem;
      margin-bottom: 2.5rem;
      line-height: 1.6;
      max-width: 90%;
      margin-left: auto;
      margin-right: auto;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: var(--accent);
      color: #ffffff;
      text-decoration: none;
      padding: 0.875rem 2rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 14px 0 rgba(47, 129, 247, 0.39);
    }

    .btn:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px 0 rgba(47, 129, 247, 0.5);
    }

    .btn svg {
      width: 20px;
      height: 20px;
      transition: transform 0.3s ease;
    }

    .btn:hover svg {
      transform: translateX(4px);
    }

    .redirect-status {
      margin-top: 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      color: var(--text-muted);
      font-size: 0.875rem;
      font-weight: 500;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(139, 148, 158, 0.3);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes slideUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {
      0% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-10px);
      }

      100% {
        transform: translateY(0px);
      }
    }

    @keyframes pulseGlow {
      from {
        opacity: 0.2;
        transform: translate(-50%, -50%) scale(0.8);
      }

      to {
        opacity: 0.4;
        transform: translate(-50%, -50%) scale(1.1);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="logo-container">
      <div class="logo-glow"></div>
      <img src="assets/img/viralflow_logo.png" alt="ViralFlow Logo" class="logo">
    </div>

    <h1>Our Documentation Has Moved</h1>

    <p>We've moved our documentation to Read The Docs. Click the button below to visit our new docs.</p>

    <a href="https://viralflow.readthedocs.io/en/latest/" class="btn">
      Go to ReadTheDocs
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
      </svg>
    </a>
  </div>

</body>

</html>
